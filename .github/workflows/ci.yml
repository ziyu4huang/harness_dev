name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Type check (deepseek-cli)
        working-directory: bun_apps/deepseek-cli
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Build (deepseek-cli)
        working-directory: bun_apps/deepseek-cli
        run: bun run build
